- name: Reboot Servers
  hosts: all
  gather_facts: false
  
  tasks:

    - name: Reboot the Debian or Ubuntu server
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime
      register: reboot
      become: true

    - name: debug reboot
      ansible.builtin.debug:
        msg: "{{reboot}}"