#!/usr/bin/env ansible-playbook
---
- name: install docker on docker servers
  hosts: tags_docker,tags_cert_auth

  roles:
    - role: geerlingguy.docker
  become: true

- name: install netbox docker container
  hosts: tags_docker

  roles:
    - role: netbox_docker
  become: true

- name: install ejbca docker container
  hosts: tags_cert_auth

  roles:
    - role: ejbca_docker
  become: true