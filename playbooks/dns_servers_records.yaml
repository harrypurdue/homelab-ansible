- name: Updating DNS zone files on dns-01.lab.lan 
  gather_facts: true
  hosts: dns-01.lab.lan
  vars_files:
    - ../vars/records-db.lab.lan.yaml

  tasks:
  - name: copy forward zone file
    ansible.builtin.template:
      src: /home/harry/ansible/homelab/templates/dns/db.lab.lan.j2
      dest: /etc/bind/db.lab.lan
    become: true

  - name: copy reverse zone file 10.0.0.0/24
    ansible.builtin.template:
      src: /home/harry/ansible/homelab/templates/dns/0.0.10.in-addr.arpa
      dest: /etc/bind/0.0.10.in-addr.arpa
    become: true

  - name: copy reverse zone file 10.1.0.0/24
    ansible.builtin.template:
      src: /home/harry/ansible/homelab/templates/dns/1.0.10.in-addr.arpa
      dest: /etc/bind/1.0.10.in-addr.arpa
    become: true

  - name: restart named service
    ansible.builtin.systemd_service:
      state: restarted
      name: named
    become: true

- name: Restarting named on dns-02.lab.lan 
  gather_facts: true
  hosts: dns-02.lab.lan
  tags: secondary

  tasks:
  - name: restart named service
    ansible.builtin.systemd_service:
      state: restarted
      name: named
    become: true
