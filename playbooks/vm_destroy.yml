#!/usr/bin/env ansible-playbook

---
- name: virtual machine destroy
  hosts: localhost
  gather_facts: false
  vars:
    netbox_url: "{{ lookup('ansible.builtin.env', 'NETBOX_API')}}"
    netbox_token: "{{ lookup('ansible.builtin.env', 'NETBOX_TOKEN')}}"
    zabbix_host: "{{ lookup('ansible.builtin.env', 'ZABBIX_HOST')}}"
    scripts_dir: "{{ playbook_dir }}/scripts"
    py_script: "{{ scripts_dir }}/dns_records.py"
    domain_name: "lab.lan"
  
  tasks:
    - name: virtual machine shutdown
      community.proxmox.proxmox_kvm:
        name: "{{ vm_name }}"
        node: pve
        state: stopped
      register: result
      until: "'timeout' not in result.msg"
      retries: 3

    - name: virtual machine destroy
      community.proxmox.proxmox_kvm:
        name: "{{ vm_name }}"
        node: pve
        state: absent

    - name: netbox virtual machine remove
      netbox.netbox.netbox_virtual_machine:
          netbox_url: "{{ netbox_url }}"
          netbox_token: "{{ netbox_token }}"
          data:
            name: "{{ vm_name }}"
          state: absent

    - name: remove from zabbix
      vars:
        ansible_network_os: community.zabbix.zabbix
        ansible_connection: httpapi
        ansible_httpapi_port: 8080
        ansible_httpapi_use_ssl: false
        ansible_httpapi_validate_certs: false
        ansible_host: "{{ zabbix_host }}"
        ansible_zabbix_url_path: ""
      community.zabbix.zabbix_host:
        host_name: "{{ vm_name }}"
        state: absent

    - name: get config context
      netbox.netbox.netbox_config_context:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        data:
          name: "dns_records"
          data:
        state: present
      register: config_context

    - name: deleting {{ vm_name }} from {{ domain_name }}
      ansible.builtin.set_fact:
        new_config_context: "{{ config_context.config_context.data | ansible.utils.remove_keys([vm_name]) }}"
      when: config_context.config_context.data.domains[domain_name][vm_name] is defined

    - name: get config context
      netbox.netbox.netbox_config_context:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        data:
          name: "dns_records"
          data: "{{ new_config_context }}"
        state: present
      register: config_context
