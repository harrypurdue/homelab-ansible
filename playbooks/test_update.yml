- name: update dns secondary/testing servers
  gather_facts: false
  hosts: ubuntu_staging_servers

  tasks:
    - name: update
      include_tasks: tasks/package_update_ubuntu.yaml
    
    - name: verify
      include_tasks: tasks/{{verification}}
      register: verify_result
      when: verification is defined

    - name: debug
      ansible.builtin.debug:
        msg: "{{verify_result}}"
        verbosity: 1