---
  - name: check for reboot {{ ansible_facts.os_family }}
    ansible.builtin.shell:
      cmd: dnf needs-restarting
    register: result
    ignore_errors: true

  - name: reboot {{ ansible_facts.os_family }}
    ansible.builtin.reboot:
      msg: "Reboot initiated by Ansible"
      connect_timeout: 5
      reboot_timeout: 300
      pre_reboot_delay: 0
      post_reboot_delay: 30
      test_command: uptime
    when: result.rc > 0
    become: true