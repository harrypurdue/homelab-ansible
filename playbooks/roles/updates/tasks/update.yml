---
- name: update {{ ansible_facts.os_family }}
  ansible.builtin.apt:
    force_apt_get: true
    update_cache: true
    upgrade: dist
  become: true
  when: ansible_facts.os_family == 'Debian'

- name: update {{ ansible_facts.os_family }}
  ansible.builtin.dnf:
    update_cache: true
    name: "*"
    state: latest
  become: true
  when: ansible_facts.os_family == 'RedHat'

