---
- include_tasks: zabbix_agent_{{ansible_facts.os_family}}.yml

- name: install zabbix agent
  ansible.builtin.package:
    name: zabbix-agent
    update_cache: true
    state: latest
  become: true
  notify: restart zabbix agent

- name: copy config file
  ansible.builtin.copy:
    src: zabbix_agentd.conf
    dest: "{{ config_destination }}"
  become: true
  notify: restart zabbix agent

- name: enable systemd zabbix-agent unit
  ansible.builtin.systemd_service:
    name: zabbix-agent
    enabled: true
  become: true