---

- name: config file
  ansible.builtin.template:
    src: named.conf.j2
    dest: /etc/bind/named.conf
    owner: root
    group: bind
    mode: 0644
    backup: true
  notify: restart named
  become: true
  tags: config

- name: config local file
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: 0644
    backup: true
  notify: restart named
  become: true
  tags: config

- name: config options file
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: 0644
    backup: true
  notify: restart named
  become: true
  tags: config
